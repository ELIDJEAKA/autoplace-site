name: CI / Déploiement dev

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_HOST: 45.90.161.191 # elidjeaka-dev (même serveur que l'API et le dashboard)
  DEPLOY_DIR: autoplace-site-dev
  SITE_PORT: 3000

jobs:
  check:
    name: Lint, types et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  build:
    name: Image Docker (GHCR)
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "base=ghcr.io/${owner}/autoplace-site" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/autoplace-site:dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          build-args: |
            VITE_SITE_URL=${{ vars.VITE_SITE_URL || 'https://autoeburni.ci' }}
            VITE_DASHBOARD_URL=${{ vars.VITE_DASHBOARD_URL || 'https://preview-espace-vendeurs.autoeburni.ci' }}
            VITE_PLAY_STORE_URL=${{ vars.VITE_PLAY_STORE_URL }}
            VITE_APP_STORE_URL=${{ vars.VITE_APP_STORE_URL }}
            VITE_CONTACT_EMAIL=${{ vars.VITE_CONTACT_EMAIL || 'autoeburni@gmail.com' }}
            VITE_CONTACT_PHONE=${{ vars.VITE_CONTACT_PHONE }}
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://preview-api.autoeburni.ci/api/v1' }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAAFqGtqS7kX8B3_Zd' }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.base }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement dev (elidjeaka-dev)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://autoeburni.ci
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      SSH_USER: ${{ vars.DEPLOY_SSH_USER || secrets.DEPLOY_SSH_USER }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Clé SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # Clé d'hôte épinglée obligatoire (pas de ssh-keyscan : un serveur usurpé recevrait la clé et les secrets)
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Secret DEPLOY_KNOWN_HOSTS manquant : ajoutez l'empreinte vérifiée du serveur (voir README)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" "$SSH_USER" > ~/.ssh/config

      - name: Envoi de la configuration
        run: |
          ssh target "mkdir -p ~/$DEPLOY_DIR"
          scp deploy/docker-compose.dev.yml target:"$DEPLOY_DIR/docker-compose.yml"

      - name: Mise à jour du conteneur
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Jeton GHCR transmis par l'entrée standard dans un fichier 600 (jamais sur une ligne de commande : `ps`)
          printf '%s\n' "$GHCR_TOKEN" | ssh target "mkdir -p ~/$DEPLOY_DIR && umask 077 && cat > ~/$DEPLOY_DIR/.ghcr-token"
          ssh target "IMAGE='$IMAGE' DEPLOY_DIR='$DEPLOY_DIR' GHCR_USER='$GHCR_USER' bash -s" <<'EOF'
          set -euo pipefail
          cd ~/"$DEPLOY_DIR"
          trap 'rm -f .ghcr-token; docker logout ghcr.io >/dev/null' EXIT
          docker login ghcr.io -u "$GHCR_USER" --password-stdin < .ghcr-token
          rm -f .ghcr-token
          echo "IMAGE=$IMAGE" > .image
          docker compose --env-file .image pull
          docker compose --env-file .image up -d --remove-orphans
          docker image prune -f
          EOF

      - name: Vérification
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://$DEPLOY_HOST:$SITE_PORT/"; then echo "Site vitrine en ligne"; exit 0; fi
            sleep 2
          done
          ssh target "cd ~/$DEPLOY_DIR && docker compose --env-file .image logs --tail 80 site"
          exit 1
